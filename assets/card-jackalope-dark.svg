.sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
.ink { fill: #f5f4f8; } .sec { fill: #a6a2b8; } .ter { fill: #7c7891; }
.mut { fill: #4a4759; } .acc { fill: #b9a6f2; } .strong { fill: #8b74ec; }
@keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes gone { from { opacity: 1; } to { opacity: 0; } }
.rise { animation: rise 520ms cubic-bezier(.2,.7,.2,1) both; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

</style>
