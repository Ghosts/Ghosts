<svg xmlns="http://www.w3.org/2000/svg" width="440" height="168" viewBox="0 0 440 168" role="img">
<style>
text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #16141d; white-space: pre; }
.sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
.ink { fill: #16141d; } .sec { fill: #55516a; } .ter { fill: #837e97; }
.mut { fill: #c9c5d6; } .acc { fill: #6d4fd8; } .strong { fill: #5a3cc9; }
@keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes gone { from { opacity: 1; } to { opacity: 0; } }
.rise { animation: rise 520ms cubic-bezier(.2,.7,.2,1) both; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

</style>
